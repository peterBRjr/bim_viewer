name: Build iOS IPA (Sideloadly / AltStore)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        working-directory: refe_
        run: flutter pub get

      - name: Run Tests
        working-directory: refe_
        run: flutter test

      - name: Build iOS App (Release, No CodeSign)
        working-directory: refe_
        run: flutter build ios --release --no-codesign

      - name: Package IPA for Sideloadly
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r refe_/build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y BimViewer.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BimViewer-iOS-IPA
          path: build/ios/ipa/BimViewer.ipa
          retention-days: 7

